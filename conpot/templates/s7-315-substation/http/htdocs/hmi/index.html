<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SIMATIC HMI &mdash; Authentication Required</title>
  <style>
    body { background: #1a1a2e; color: #eee; font-family: Arial, sans-serif; margin: 0; }
    .header { background: #003366; padding: 10px 20px; display: flex; align-items: center; }
    .header h1 { color: #fff; font-size: 16px; margin: 0; }
    .logo { color: #00aaff; font-weight: bold; font-size: 20px; margin-right: 15px; }
    .container { max-width: 380px; margin: 70px auto; background: #252540; padding: 26px; border-radius: 4px; border-top: 3px solid #003366; }
    h2 { color: #aac8ff; font-size: 15px; margin-top: 0; }
    p.note { font-size: 12px; color: #99a; margin: 0 0 14px 0; }
    label { display: block; margin-top: 10px; font-size: 13px; color: #bbb; }
    input[type=text], input[type=password] {
      width: 100%; padding: 8px; margin-top: 4px; background: #1a1a2e;
      border: 1px solid #446; color: #fff; border-radius: 3px; box-sizing: border-box;
    }
    input[type=submit] {
      margin-top: 18px; width: 100%; padding: 9px; background: #003366;
      color: #fff; border: none; border-radius: 3px; cursor: pointer; font-size: 14px;
    }
    input[type=submit]:hover { background: #004488; }
    .footer { margin-top: 18px; font-size: 11px; color: #666; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">SIEMENS</span>
    <h1>SIMATIC HMI &mdash; Substation Runtime</h1>
  </div>
  <div class="container">
    <h2>Authentication Required</h2>
    <p class="note">Runtime access is restricted to configured operator accounts.</p>
    <form method="POST" action="/login">
      <label for="user">User name</label>
      <input type="text" id="user" name="username" autocomplete="off">
      <label for="pass">Password</label>
      <input type="password" id="pass" name="password">
      <input type="submit" value="Sign in">
    </form>
    <div class="footer">SUBSTATION-01 &bull; CPU 315-2 PN/DP &bull; V3.3.14</div>
  </div>
</body>
</html>
