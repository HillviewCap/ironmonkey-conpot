<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MicroLogix 1400 &ndash; Authentication Required</title>
  <style>
    body { background: #101418; color: #eee; font-family: Arial, sans-serif; margin: 0; }
    .header { background: #0b3d2e; padding: 10px 20px; display: flex; align-items: center; }
    .header h1 { color: #fff; font-size: 16px; margin: 0; }
    .logo { color: #7ad1a6; font-weight: bold; font-size: 20px; margin-right: 15px; }
    .container { max-width: 380px; margin: 70px auto; background: #1b2228; padding: 26px; border-radius: 4px; border-top: 3px solid #0b3d2e; }
    h2 { color: #b6e3cd; font-size: 15px; margin-top: 0; }
    p.note { font-size: 12px; color: #94a8a0; margin: 0 0 14px 0; }
    label { display: block; margin-top: 10px; font-size: 13px; color: #bbb; }
    input[type=text], input[type=password] {
      width: 100%; padding: 8px; margin-top: 4px; background: #101418;
      border: 1px solid #2e4a3e; color: #fff; border-radius: 3px; box-sizing: border-box;
    }
    input[type=submit] {
      margin-top: 18px; width: 100%; padding: 9px; background: #0b3d2e;
      color: #fff; border: none; border-radius: 3px; cursor: pointer; font-size: 14px;
    }
    input[type=submit]:hover { background: #12573f; }
    .footer { margin-top: 18px; font-size: 11px; color: #666; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">Allen-Bradley</span>
    <h1>MicroLogix 1400 &mdash; Process Display</h1>
  </div>
  <div class="container">
    <h2>Authentication Required</h2>
    <p class="note">Process display access is restricted to configured operator accounts.</p>
    <form method="POST" action="/login">
      <label for="user">User name</label>
      <input type="text" id="user" name="username" autocomplete="off">
      <label for="pass">Password</label>
      <input type="password" id="pass" name="password">
      <input type="submit" value="Sign in">
    </form>
    <div class="footer">WTP-01 &bull; 1766-L32BWA &bull; FRN 21.003</div>
  </div>
</body>
</html>
