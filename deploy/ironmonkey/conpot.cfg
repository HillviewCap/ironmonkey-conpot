[common]
# Stamped on every line of the sensor's own conpot.json. Deliberately NOT
# persona-specific since step H11: one conpot.cfg ships to every sensor
# whatever --template it runs, and a value naming the S7-315 would be wrong on
# a water-utility or pipeline sensor. Nothing downstream reads it -- the
# forwarder overrides the event's sensor_id from SENSOR_ID -- so it exists to
# be readable on the box, not to carry identity.
sensorid = ironmonkey-conpot

[virtual_file_system]
data_fs_url = default
fs_url = default

[session]
timeout = 30

[daemon]
;user = conpot
;group = conpot

[json]
enabled = True
filename = /var/log/conpot/conpot.json

[sqlite]
enabled = False

[syslog]
enabled = False

[hpfriends]
enabled = False

[taxii]
enabled = False

[fetch_public_ip]
enabled = False
